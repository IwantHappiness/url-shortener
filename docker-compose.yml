services:
  url-postgres:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/out/pgdata:/var/lib/postgresql
    restart: always

  url-migrate:
    image: migrate/migrate:v4.19.1
    container_name: url-migrate
    volumes:
      - ./backend/migrations:/migrations
    depends_on:
      url-postgres:
        condition: service_healthy

  port-forward:
    image: alpine/socat:1.8.0.3
    container_name: url-port-forward
    command: tcp-listen:${POSTGRES_PORT},fork,reuseaddr tcp-connect:url-postgres:${POSTGRES_PORT}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    depends_on:
      - url-postgres
    restart: always

  swagger:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM golang:1.26-alpine
        RUN apk add --no-cache
        RUN go install github.com/swaggo/swag/cmd/swag@latest
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ./backend:/code
    command:
      [
        "init",
        "-g",
        "./cmd/api/main.go",
        "-o",
        "./docs",
        "--parseInternal",
        "--parseDependency",
      ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - POSTGRES_HOST=url-postgres
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=10s
      - HTTP_ADDR=:8080
      - LOGGER_FOLDER=/app/logs
    depends_on:
      url-postgres:
        condition: service_healthy
      url-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: url-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
